services:
  api:
    build: ./backend
    command: ["uvicorn", "api_gateway:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app 
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://user:password@db:5432/mediamonitor
      - EMBEDDING_BASE_URL=http://embedding:11434/v1
      - EMBEDDING_API_KEY=ollama
      - REDIS_URL=redis://redis:6379/0
      - MARKER_SERVICE_URL=http://marker:8100
    depends_on:
      - db
      - embedding
      - redis
      - marker

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - ./frontend/.env
    depends_on:
      - api
      - redis

  db:
    image: ankane/pgvector:latest
    ports:
      - "5432"
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=mediamonitor
    volumes:
      - postgres_data:/var/lib/postgresql/data

  embedding:
    image: ollama/ollama:latest
    container_name: ollama-embed
    ports:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    command: serve

  redis:
    image: redis:7-alpine
    ports:
      - "6379"
    volumes:
      - redis_data:/data

  marker:
    build: ./marker-service
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8100"]
    environment:
      - PYTHONUNBUFFERED=1
      - DOCUMENT_PREVIEW_IMAGE_LIMIT=6
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - ./marker-service:/app
      - ./models/marker-cache:/root/.cache/huggingface
      - ./models/datalab-cache:/root/.cache/datalab
    ports:
      - "8100:8100"
    restart: unless-stopped

  ingestor:
    build: ./backend
    command: ["python", "ingestor_service.py"]
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      - redis
    restart: unless-stopped

  person-service:
    build: ./backend
    command: ["python", "person_service.py"]
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://user:password@db:5432/mediamonitor
      - IMAGE_STORE_PATH=/data/images
      - PERSON_SERVICE_PORT=8001
    volumes:
      - ./backend:/app
      - person_images:/data/images
    ports:
      - "8001:8001"
    depends_on:
      - redis
      - db
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
  redis_data:
  person_images:
